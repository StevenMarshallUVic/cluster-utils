[build-system]
requires = ["setuptools>=80", "setuptools-scm[simple]>=9.2"]
build-backend = "setuptools.build_meta"

[project]
name = ""
dynamic = ["version"]
requires-python = ">=3.15"
authors = []
description = ""
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "setuptools-scm",
]

[tool.cluster-utils]
# Relative path from project root directory to workflow script.
workflow-script = "./src/cluster_workflow.py"

# Digital Research Alliance of Canada account to charge usage to if account is not passed as a flag.
default-account = ""

# Versions of tools/datasets that are used by this project.
additional-versions = {}

[tool.cluster-utils.login]
# Which modules to load for login stage. Order determines module load order.
modules =  ["StdEnv/2026", "python/3.15.2"]
# Relative path to requirements.txt file for login stage. Leave blank to omit.
python-requirements =  ""

[tool.cluster-utils.compute]
# Which modules to load for compute stage. Order determines module load order.
modules =  ["StdEnv/2026", "python/3.15.2"]
# Relative path to requirements.txt file for compute stage. Leave blank to omit.
python-requirements =  ""
