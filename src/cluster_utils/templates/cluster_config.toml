# Configuration for the environment that runs will be launched in.

[global]
workflow-module-path = "src.workflow"

[login]
[login.environment]
# Which modules to load for login stage. Order determines module load order.
modules =  ["StdEnv/2026", "python/3.14.7"]
# Relative path to requirements.txt file for login stage. Leave blank to omit.
python-requirements =  ""

[compute]
[compute.environment]
# Which modules to load for compute stage. Order determines module load order.
modules =  ["StdEnv/2026", "python/3.14.7"]
# Relative path to requirements.txt file for compute stage. Leave blank to omit.
python-requirements =  ""
