[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "cam_cluster_utils"
version = "1.0.0b22"
authors = [
  { name="Steven Marshall", email="stevenmarshall@uvic.ca" },
]
description = "Utilities for working with Digital Research Alliance of Canada clusters."
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cluster_utils = ["scripts/*", "templates/*"]

[project.scripts]
cluster-init = "cluster_utils._cli:init_project"
cluster-run = "cluster_utils._cli:perform_run"

[project.urls]
Homepage = "https://github.com/StevenMarshallUVic/cluster-utils"
Issues = "https://github.com/StevenMarshallUVic/cluster-utils/issues"
