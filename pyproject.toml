[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "cam-cluster-utils"
version = "1.0.0b115"
authors = [
  { name="Steven Marshall", email="stevenmarshall@uvic.ca" },
]
description = "Utilities for working with Digital Research Alliance of Canada clusters."
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cluster_utils = ["scripts/*", "templates/*"]

[project.scripts]
cluster-update = "cluster_utils._cli:update"
cluster-init = "cluster_utils._cli:initialize_project"
cluster-run = "cluster_utils._cli:perform_run"
cluster-compute = "cluster_utils._cli:perform_compute"

[project.urls]
Homepage = "https://github.com/StevenMarshallUVic/cluster-utils"
Issues = "https://github.com/StevenMarshallUVic/cluster-utils/issues"


['sbatch', '--job-name=data_pipeline', '--account=rrg-prof', '--cpus-per-task=1', '--mem=20G', '--time=02:00:00', '--array=0-0', '--output=/scratch/name/alphafold3/runs/test/attempts/attempt_1/logs/data_pipeline-%A_%a.log', '--error=/scratch/name/alphafold3/runs/test/attempts/attempt_1/logs/data_pipeline-%A_%a.log', '--parsable', '--wrap="cd /project/id/name/alphafold3 && cluster-compute --paths-json /scratch/name/alphafold3/runs/test/attempts/attempt_1/params/paths.json --project-dir /project/id/name/alphafold3 --runner-stage COMPUTE"']
